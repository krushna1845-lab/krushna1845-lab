name: Update profile contribution art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch public contributions
        run: python scripts/fetch_contributions.py
      - name: Render SVG
        run: python scripts/render_heatmap_svg.py
      - name: Commit refreshed artwork
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution art [skip ci]"
          file_pattern: "assets/contribution-heatmap.svg data/contributions.json"
